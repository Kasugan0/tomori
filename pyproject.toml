[build-system]
requires = ["uv_build>=0.8.14,<0.14"]
build-backend = "uv_build"

[project]
name = "tomori"
version = "0.1.0"
description = "Public lighting fault inspection and work-order system (#141)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.165.0",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy[asyncio]>=2.0.58,<2.1",
  "psycopg[binary]>=3.3.9",
  "alembic>=1.20.1",
  "pydantic>=2.14.4",
  "pydantic-settings>=2.16.3",
  "pwdlib[argon2]>=0.4.2",
  "pyjwt>=2.15.1",
  "pillow>=11.0.0",
  "python-multipart>=0.0.18",
  "tzdata>=2026.6",
  "httpx>=0.28.1,<1.0.0",
]

[project.optional-dependencies]
vision = [
  "ultralytics==8.4.216",
  "opencv-python-headless>=5.1.0,<6",
  "onnxruntime>=1.20.0,<2.0.0",
  "onnx>=1.16.0,<2.0.0",
  "onnxslim>=0.1.82",
  "numpy>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=7.1.0",
  "pytest-playwright>=0.10.0",
  "httpx2>=2.16.2",
  "asgi-lifespan>=2.1.0",
  "respx>=0.23.1",
  "ruff>=0.17.6",
  "mypy>=2.3",
]

[tool.uv]
# ultralytics==8.4.216 unconditionally requests opencv-python (GUI wheel requiring libGL.so.1);
# override its marker to never-true so only opencv-python-headless provides cv2 (uv 0.8.14+ compatible).
override-dependencies = ["opencv-python; python_version < '0'"]

[tool.uv.build-backend]
module-name = "tomori"
module-root = "src"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["tomori"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = [
  "cv2",
  "cv2.*",
  "ultralytics",
  "ultralytics.*",
  "onnxruntime",
  "onnxruntime.*",
  "onnx",
  "onnx.*",
  "onnxslim",
  "onnxslim.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "fixture-scope"
asyncio_default_test_loop_scope = "function"
markers = [
  "real_commit: tests that commit real PostgreSQL transactions and truncate tables afterward",
  "vision_weights: tests requiring trained YOLO26s weights and ONNX runtime verification",
  "e2e: Playwright end-to-end browser tests guarded by stack-guard claim-e2e lock",
]
